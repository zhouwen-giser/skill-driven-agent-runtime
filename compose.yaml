name: sdar

services:
  postgres:
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile.pgvector-hardened
      args:
        SOURCE_DATE_EPOCH: '0'
      provenance: false
      sbom: false
    image: sdar/postgres-pgvector:17.10-0.8.5-alpine3.23
    pull_policy: never
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${SDAR_POSTGRES_DB:-sdar}
      POSTGRES_USER: ${SDAR_POSTGRES_USER:-sdar}
      POSTGRES_PASSWORD: ${SDAR_POSTGRES_PASSWORD:-sdar_local_only}
    ports:
      - '127.0.0.1:${SDAR_POSTGRES_PORT:-55432}:5432'
    volumes:
      - sdar-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/baseline/0001_sdar_v1_2_2_baseline.sql:/docker-entrypoint-initdb.d/0001_sdar_v1_2_2_baseline.sql:ro
      - ./infra/postgres/seed/0001_sdar_v1_2_2_minimal_seed.sql:/docker-entrypoint-initdb.d/0002_sdar_v1_2_2_minimal_seed.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: 'no'
    networks: [sdar-local]

  redis:
    image: redis@sha256:8096655e437712b07503796fb64d81359256cfcff0ab29d95a7da72863786efb
    platform: linux/amd64
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --save
      - '60'
      - '1'
    ports:
      - '127.0.0.1:${SDAR_REDIS_PORT:-56379}:6379'
    volumes:
      - sdar-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    restart: 'no'
    networks: [sdar-local]

networks:
  sdar-local:
    driver: bridge

volumes:
  sdar-postgres-data:
  sdar-redis-data:
