    parameters:
      - {
          name: view,
          in: path,
          required: true,
          schema: { type: string, enum: [decisions, model-usage, case-usage] },
        }
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getArtifactRuntimeManagementDetail
      security: [{ CognitiveBearer: [] }]
      responses:
        '200': { description: Tenant-scoped Gateway, Case or Model runtime evidence detail }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/artifacts/{artifactId}/commands/{operation}:
    parameters:
      - { name: artifactId, in: path, required: true, schema: { type: string } }
      - {
          name: operation,
          in: path,
          required: true,
          schema:
            {
              type: string,
              enum:
                [
                  validate,
                  shadow,
                  build-promotion-package,
                  approve,
                  reject,
                  activate,
                  revalidate,
                  deprecate,
                  rollback,
                  kill-switch-enable,
                  kill-switch-disable,
                ],
            },
        }
    post:
      operationId: executeArtifactGovernanceCommand
      security: [{ CognitiveBearer: [] }]
      description: Delegates a version-bound and audited command to ArtifactGovernancePort.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, expectedVersion, idempotencyKey, reason]
              properties:
                version: { type: integer, minimum: 1 }
                expectedVersion: { type: integer, minimum: 0 }
                expectedLockVersion: { type: integer, minimum: 0 }
                idempotencyKey: { type: string, minLength: 1, maxLength: 256 }
                reason: { type: string, minLength: 1, maxLength: 4096 }
                artifactKey: { type: string }
                validationRunId: { type: string }
                validationType:
                  { type: string, enum: [static, replay, simulation, shadow, revalidation] }
                datasetRef: { type: string }
                approvalId: { type: string }
                validationSummaryHash: { type: string }
                targetArtifactId: { type: string }
                targetVersion: { type: integer, minimum: 1 }
                promotionPackage:
                  type: object
                  description: Evidence hashes consumed by the formal P06 promotion-package command.
                  additionalProperties: false
                  required:
                    - promotionPackageId
                    - artifactRef
                    - artifactHash
                    - validationSummaryRef
                    - validationSummaryHash
                    - shadowSummaryRef
                    - shadowSummaryHash
                    - counterexampleSummaryRef
                    - counterexampleSummaryHash
                    - riskReviewRef
                    - riskReviewHash
                    - dependencySnapshotRef
                    - dependencySnapshotHash
                  properties:
                    promotionPackageId: { type: string, minLength: 1 }
                    artifactRef: { type: string, minLength: 1 }
                    artifactHash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                    validationSummaryRef: { type: string, minLength: 1 }
                    validationSummaryHash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                    shadowSummaryRef: { type: string, minLength: 1 }
                    shadowSummaryHash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                    counterexampleSummaryRef: { type: string, minLength: 1 }
                    counterexampleSummaryHash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                    riskReviewRef: { type: string, minLength: 1 }
                    riskReviewHash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                    dependencySnapshotRef: { type: string, minLength: 1 }
                    dependencySnapshotHash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                scope:
                  type: object
                  additionalProperties: false
                  properties:
                    artifactKey: { type: string }
                    domain: { type: string }
      responses:
        '202': { description: Governance command accepted by the formal application port }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/artifact-events:
    get:
      operationId: streamArtifactEvents
      security: [{ CognitiveBearer: [] }]
      description: Resumable, tenant-filtered, redacted projection of formal PostgreSQL Outbox facts.
      parameters:
        - { name: Last-Event-ID, in: header, schema: { type: string } }
        - { name: after, in: query, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        '200':
          description: Server-sent events; disconnect never mutates formal state
          content: { text/event-stream: { schema: { type: string } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    CognitiveBearer:
      type: http
      scheme: bearer
      description: Optional deployment-configured bearer guard for cognitive management writes.
  parameters:
    BoundedListLimit:
      {
        name: limit,
        in: query,
        required: false,
        schema: { type: integer, minimum: 1, maximum: 500, default: 100 },
      }
    CandidateId: { name: candidateId, in: path, required: true, schema: { type: string } }
    MemoryId: { name: memoryId, in: path, required: true, schema: { type: string } }
    ServerId: { name: serverId, in: path, required: true, schema: { type: string } }
    SkillId: { name: skillId, in: path, required: true, schema: { type: string } }
    TaskId: { name: taskId, in: path, required: true, schema: { type: string } }
  responses:
    Error:
      description: Stable error envelope
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
  schemas:
    DeterministicCapabilityExecutionRequest:
      type: object
      additionalProperties: false
      required:
        [
          taskId,
          contextId,
          capabilityBindingId,
          capabilityBindingVersion,
          capabilityId,
          capabilityVersion,
          skillId,
          skillVersion,
          mcpProviderBindingId,
          providerId,
          serverId,
          toolName,
          resourceId,
        ]
      properties:
        taskId: { type: string, minLength: 1, maxLength: 512 }
        contextId: { type: string, minLength: 1, maxLength: 512 }
        capabilityBindingId: { type: string, minLength: 1, maxLength: 512 }
        capabilityBindingVersion: { type: integer, minimum: 1 }
        capabilityId: { type: string, minLength: 1, maxLength: 512 }
        capabilityVersion: { type: integer, minimum: 1 }
        skillId: { type: string, minLength: 1, maxLength: 512 }
        skillVersion: { type: integer, minimum: 1 }
        mcpProviderBindingId: { type: string, minLength: 1, maxLength: 512 }
        providerId: { type: string, minLength: 1, maxLength: 512 }
        serverId: { type: string, minLength: 1, maxLength: 512 }
        toolName: { type: string, minLength: 1, maxLength: 512 }
        resourceId:
          type: string
          minLength: 1
          maxLength: 512
          description: Public resource identifier; Provider-private Home Assistant entity IDs are not admitted.
    DeterministicCapabilityExecutionResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, status, execution, result, evidence, safety]
      properties:
        schemaVersion:
          type: string
          const: sdar.deterministic-read-only-capability-execution/v1
        status: { type: string, const: succeeded }
        execution:
          type: object
          additionalProperties: false
          required:
            [
              taskId,
              capabilityBindingId,
              capabilityBindingVersion,
              capabilityId,
              capabilityVersion,
              skillId,
              skillVersion,
              workflowPlanId,
              workflowInstanceId,
              mcpProviderBindingId,
              mcpInvocationId,
              providerId,
              serverId,
              toolName,
              resourceId,
            ]
          properties:
            taskId: { type: string, minLength: 1 }
            capabilityBindingId: { type: string, minLength: 1 }
            capabilityBindingVersion: { type: integer, minimum: 1 }
            capabilityId: { type: string, minLength: 1 }
            capabilityVersion: { type: integer, minimum: 1 }
            skillId: { type: string, minLength: 1 }
            skillVersion: { type: integer, minimum: 1 }
            workflowPlanId: { type: string, minLength: 1 }
            workflowInstanceId: { type: string, minLength: 1 }
            mcpProviderBindingId: { type: string, minLength: 1 }
            mcpInvocationId: { type: string, minLength: 1 }
            providerId: { type: string, minLength: 1 }
            serverId: { type: string, minLength: 1 }
            toolName: { type: string, minLength: 1 }
            resourceId: { type: string, minLength: 1 }
        result: {}
        evidence:
          type: array
          items: { $ref: '#/components/schemas/DeterministicCapabilityEvidenceMatch' }
        safety:
          type: object
          additionalProperties: false
          required: [executionMode, physicalWrites, modelCalls, mcpCalls, identifierAuthority]
          properties:
            executionMode: { type: string, const: live }
            physicalWrites: { type: integer, const: 0 }
            modelCalls: { type: integer, const: 0 }
            mcpCalls: { type: integer, const: 1 }
            identifierAuthority: { type: string, const: public_resource_id }
    DeterministicCapabilityEvidenceMatch:
      type: object
      additionalProperties: false
      required: [requirementId, evidenceType, required, hardGate, satisfied]
      properties:
        requirementId: { type: string, minLength: 1 }
        evidenceType: { type: string, minLength: 1 }
        required: { type: boolean }
        hardGate: { type: boolean }
        satisfied: { type: boolean }
        evidenceId: { type: string, minLength: 1 }
        observedAt: { type: string, format: date-time }
        payloadRef: { $ref: '#/components/schemas/ProviderEvidencePayloadRef' }
    ProviderEvidencePayloadRef:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, jsonPointer]
          properties:
            kind: { type: string, const: structured_content }
            jsonPointer: { type: string }
        - type: object
          additionalProperties: false
          required: [kind, uri]
          properties:
            kind: { type: string, const: uri }
            uri: { type: string, minLength: 1 }
            mediaType: { type: string }
            sha256: { type: string }
    CognitiveWriteAction:
      type: object
      additionalProperties: false
      required: [expectedVersion, idempotencyKey, actorId, reason]
      properties:
        expectedVersion:
          type: integer
          minimum: 0
          description: Current authoritative revision; use 0 only when the managed resource is absent or an Experience dead letter is unreplayed.
        idempotencyKey: { type: string, minLength: 1, maxLength: 256 }
        actorId: { type: string, minLength: 1, maxLength: 256 }
        reason: { type: string, minLength: 1, maxLength: 2048 }
    CognitiveManagementActionRecord:
      type: object
      additionalProperties: false
      required:
        [
          actionId,
          operation,
          subjectId,
          expectedVersion,
          idempotencyKey,
          actorId,
          reason,
          requestHash,
          status,
          claimedAt,
          updatedAt,
        ]
      properties:
        actionId: { type: string }
        operation:
          enum:
            [
              goal_session_action,
              planning_session_action,
              capability_rebuild,
              capability_card_rebuild,
              experience_dead_letter_replay,
              knowledge_promote,
              knowledge_reject,
              knowledge_revalidate,
              knowledge_deprecate,
            ]
        subjectId: { type: string }
        expectedVersion: { type: integer, minimum: 0 }
        idempotencyKey: { type: string }
        actorId: { type: string }
        reason: { type: string }
        requestHash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        status: { enum: [pending, completed, failed] }
        result: {}
        errorCode: { type: string }
        claimedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        failedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    KnowledgeKind:
      type: string
      enum: [planning_heuristic, task_type, capability_pattern]
    KnowledgePromoteAction:
      type: object
      additionalProperties: false
      required: [expectedVersion, idempotencyKey, actorId, reason, humanApproved, policyAllowed]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 256 }
        actorId: { type: string, minLength: 1, maxLength: 256 }
        reason: { type: string, minLength: 1, maxLength: 2048 }
        humanApproved: { type: boolean }
        policyAllowed: { type: boolean }
    KnowledgeRejectAction:
      type: object
      additionalProperties: false
      required: [expectedVersion, idempotencyKey, actorId, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 256 }
        actorId: { type: string, minLength: 1, maxLength: 256 }
        reason: { type: string, minLength: 1, maxLength: 2048 }
    KnowledgeRevalidateAction:
      type: object
      additionalProperties: false
      required: [expectedVersion, idempotencyKey, actorId, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 256 }
        actorId: { type: string, minLength: 1, maxLength: 256 }
        reason:
          enum: [contradiction_detected, catalog_changed, policy_changed, skill_version_changed]
    KnowledgeDeprecateAction:
      type: object
      additionalProperties: false
      required: [expectedVersion, idempotencyKey, actorId, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 256 }
        actorId: { type: string, minLength: 1, maxLength: 256 }
        reason: { type: string, minLength: 1, maxLength: 2048 }
    GoalExperienceEpisodeList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              [
                schemaVersion,
                episodeId,
                goalId,
                goalVersion,
                contextId,
                episodeType,
                revision,
                terminalOutcomeRef,
                sourceHash,
                episodeHash,
                completeness,
                status,
                dataClassification,
                snapshot,
                sourceRefs,
                redactionCodes,
                createdAt,
              ]
            properties:
              schemaVersion: { const: '1.0' }
              episodeId: { type: string }
              goalId: { type: string }
              goalVersion: { type: integer, minimum: 1 }
              taskId: { type: string }
              contextId: { type: string }
              episodeType: { enum: [terminal, revision, interaction, recovery] }
              revision: { type: integer, minimum: 1 }
              terminalOutcomeRef: { type: string }
              sourceHash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
              episodeHash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
              completeness: { type: number, minimum: 0, maximum: 1 }
              status: { enum: [partial, complete] }
              dataClassification: { enum: [public, internal, user_scoped, restricted] }
              snapshot: { type: object, additionalProperties: true }
              sourceRefs: { type: array, minItems: 1, items: { type: object } }
              redactionCodes: { type: array, items: { type: string } }
              createdAt: { type: string, format: date-time }
    ExperienceDeadLetterList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [deadLetterId, jobId, errorCode, errorSummary, failedAt]
            properties:
              deadLetterId: { type: string }
              jobId: { type: string }
              errorCode: { type: string }
              errorSummary: { type: string, maxLength: 2048 }
              failedAt: { type: string, format: date-time }
              replayedAt: { type: string, format: date-time }
              replayedBy: { type: string }
    ExperienceObservationList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ExperienceObservation' }
    ExperienceObservation:
      type: object
      additionalProperties: false
      required:
        [
          schemaVersion,
          observationId,
          scope,
          sourceEpisodeIds,
          revision,
          status,
          statements,
          extractions,
          modelInvocationRefs,
          observationHash,
          summary,
          createdAt,
        ]
      properties:
        schemaVersion: { const: '1.0' }
        observationId: { type: string }
        scope: { enum: [goal_episode, planning_interaction, cross_episode_batch] }
        sourceEpisodeIds: { type: array, minItems: 1, maxItems: 8, items: { type: string } }
        revision: { type: integer, minimum: 1 }
        status: { enum: [partial, completed, failed] }
        statements:
          type: array
          items: { $ref: '#/components/schemas/ExperienceObservationStatement' }
        extractions:
          type: array
          items: { $ref: '#/components/schemas/ExperienceExtraction' }
        modelInvocationRefs: { type: array, items: { type: string } }
        observationHash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        summary: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    ExperienceObservationStatement:
      type: object
      additionalProperties: false
      required: [statementId, kind, summary, confidence, sourceRefIds]
      properties:
        statementId: { type: string }
        kind: { enum: [fact, inference, candidate_lesson, uncertainty, contradiction] }
        summary: { type: string, minLength: 1, maxLength: 4096 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        sourceRefIds: { type: array, minItems: 1, items: { type: string } }
    ExperienceExtraction:
      type: object
      additionalProperties: false
      required:
        [
          extractionId,
          observationId,
          extractorKind,
          status,
          modelTier,
          sourceEpisodeIds,
          statements,
          changeSuggestions,
          inputBytes,
          outputBytes,
          createdAt,
        ]
      properties:
        extractionId: { type: string }
        observationId: { type: string }
        extractorKind:
          enum:
            [
              goal_pattern,
              task_type_signal,
              decomposition,
              dependency,
              criterion,
              evidence,
              artifact,
              capability,
              failure,
              recovery,
              no_progress,
              human_correction,
            ]
        status: { enum: [completed, no_op, failed] }
        modelTier: { enum: [fast, reasoning] }
        sourceEpisodeIds: { type: array, minItems: 1, maxItems: 8, items: { type: string } }
        statements:
          type: array
          items: { $ref: '#/components/schemas/ExperienceObservationStatement' }
        changeSuggestions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [action, summary, sourceRefIds]
            properties:
              action:
                enum:
                  [create_candidate, create_revision, suggest_supersede, suggest_reject, no_change]
              summary: { type: string, minLength: 1, maxLength: 4096 }
              sourceRefIds: { type: array, minItems: 1, items: { type: string } }
        modelInvocationId: { type: string }
        errorCode: { type: string }
        inputBytes: { type: integer, minimum: 0, maximum: 524288 }
        outputBytes: { type: integer, minimum: 0, maximum: 262144 }
        createdAt: { type: string, format: date-time }
    ExperienceReflectionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ExperienceReflection' }
    ExperienceReflection:
      type: object
      additionalProperties: false
      required:
        [
          schemaVersion,
          reflectionId,
          seedObservationId,
          observationIds,
          revision,
          status,
          group,
          impacts,
          deltas,
          modelInvocationRefs,
          reflectionHash,
          createdAt,
        ]
      properties:
        schemaVersion: { const: '1.0' }
        reflectionId: { type: string }
        seedObservationId: { type: string }
        observationIds: { type: array, minItems: 1, maxItems: 100, items: { type: string } }
        revision: { type: integer, minimum: 1 }
        status: { enum: [completed, no_op, failed] }
        group:
          type: object
          additionalProperties: false
          required: [goalPatternFingerprint, capabilityFingerprint, timeWindow]
          properties:
            tenantId: { type: string }
            goalPatternFingerprint: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
            taskTypeCandidateId: { type: string }
            capabilityFingerprint: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
            timeWindow: { type: string, pattern: '^\\d{4}-\\d{2}-\\d{2}/P7D$' }
        impacts:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              [
                impactId,
                disposition,
                observationId,
                statementId,
                sourceEpisodeIds,
                sourceRefIds,
                outcomeRefs,
                summary,
              ]
            properties:
              impactId: { type: string }
              disposition: { enum: [helpful, harmful, neutral] }
              observationId: { type: string }
              statementId: { type: string }
              sourceEpisodeIds: { type: array, minItems: 1, items: { type: string } }
              sourceRefIds: { type: array, minItems: 1, items: { type: string } }
              outcomeRefs: { type: array, items: { type: string } }
              summary: { type: string, minLength: 1, maxLength: 4096 }
        deltas:
          type: array
          items: { $ref: '#/components/schemas/KnowledgeDelta' }
        modelInvocationRefs: { type: array, items: { type: string } }
        reflectionHash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        createdAt: { type: string, format: date-time }
    TaskTypeDefinitionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TaskTypeDefinition' }
    TaskTypeDefinition:
      type: object
      additionalProperties: false
      required:
        [
          schemaVersion,
          taskTypeId,
          revision,
          status,
          origin,
          inductionMode,
          fingerprint,
          title,
          summary,
          recognition,
          requiredDimensions,
          optionalDimensions,
          criteriaTemplate,
          capabilityRequirements,
          goalPattern,
          dependencyPattern,
          incompatibleConstraints,
          exemplars,
          sourceRefs,
          createdAt,
        ]
      properties:
        schemaVersion: { const: '1.0' }
        taskTypeId: { type: string }
        revision: { type: integer, minimum: 1 }
        status: { enum: [candidate, validating, active, deprecated, rejected] }
        origin: { enum: [fixture, induced] }
        inductionMode: { enum: [offline_batch, online_candidate] }
        fingerprint: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        title: { type: string, minLength: 1, maxLength: 512 }
        summary: { type: string, minLength: 1, maxLength: 4096 }
        recognition:
          type: object
          additionalProperties: false
          required: [hints, positiveExamples, negativeExamples]
          properties:
            hints: { type: array, minItems: 1, maxItems: 32, items: { type: string } }
            positiveExamples: { type: array, minItems: 1, maxItems: 16, items: { type: string } }
            negativeExamples: { type: array, minItems: 1, maxItems: 16, items: { type: string } }
        requiredDimensions:
          type: array
          maxItems: 16
          items: { $ref: '#/components/schemas/TaskDimensionKind' }
        optionalDimensions:
          type: array
          maxItems: 16
          items: { $ref: '#/components/schemas/TaskDimensionKind' }
        criteriaTemplate: { type: array, minItems: 1, maxItems: 32, items: { type: string } }
        capabilityRequirements: { type: array, minItems: 1, maxItems: 32, items: { type: string } }
        goalPattern: { type: string, minLength: 1, maxLength: 4096 }
        dependencyPattern: { type: array, minItems: 1, maxItems: 64, items: { type: string } }
        incompatibleConstraints: { type: array, maxItems: 32, items: { type: string } }
        exemplars:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [episodeId, goalId, goalVersion, summary]
            properties:
              episodeId: { type: string }
              goalId: { type: string }
              goalVersion: { type: integer, minimum: 1 }
              summary: { type: string, minLength: 1, maxLength: 4096 }
        sourceRefs:
          type: array
          minItems: 1
          items: { type: object, additionalProperties: true }
        modelInvocationId: { type: string }
        createdAt: { type: string, format: date-time }
    TaskDimensionKind:
      enum:
        [
          target,
          scope,
          time_range,
          priority,
          criteria,
          artifact,
          evidence,
          side_effect_authorization,
          risk_tolerance,
          degradation_policy,
          uncovered_case_policy,
          human_confirmation_policy,
        ]
    CapabilityPatternList:
      type: object
      additionalProperties: false
      required: [items, gaps]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CapabilityPatternDefinition' }
        gaps:
          type: array
          items: { $ref: '#/components/schemas/CapabilityGapCandidate' }
    CapabilityPatternDefinition:
      type: object
      additionalProperties: false
      required:
        [
          schemaVersion,
          patternId,
          revision,
          version,
          status,
          fingerprint,
          catalogHash,
          policyVersion,
          capabilityId,
          title,
          summary,
          applicableConditions,
          effects,
          evidenceRequirements,
          artifacts,
          prerequisites,
          dependencies,
          failures,
          limitations,
          evidenceByLevel,
          exactSkillVersionMappings,
          requiresCurrentReadiness,
          sourceRefs,
          modelInvocationId,
          createdAt,
        ]
      properties:
        schemaVersion: { const: '1.0' }
        patternId: { type: string }
        revision: { type: integer, minimum: 1 }
        version: { type: integer, minimum: 1 }
        status: { enum: [candidate, validating, active, deprecated, rejected] }
        fingerprint: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        catalogHash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        policyVersion: { type: string }
        capabilityId: { type: string }
        title: { type: string, minLength: 1, maxLength: 512 }
        summary: { type: string, minLength: 1, maxLength: 4096 }
        applicableConditions: { type: array, minItems: 1, maxItems: 64, items: { type: string } }
        effects: { type: array, minItems: 1, maxItems: 64, items: { type: string } }
        evidenceRequirements: { type: array, minItems: 1, maxItems: 64, items: { type: string } }
        artifacts: { type: array, minItems: 1, maxItems: 64, items: { type: string } }
        prerequisites: { type: array, maxItems: 64, items: { type: string } }
        dependencies: { type: array, maxItems: 64, items: { type: string } }
        failures: { type: array, maxItems: 64, items: { type: string } }
        limitations: { type: array, maxItems: 64, items: { type: string } }
        evidenceByLevel:
          type: object
          additionalProperties: false
          required: [declared, observed, validated]
          properties:
            declared:
              type: array
              items: { $ref: '#/components/schemas/CapabilityPatternEvidence' }
            observed:
              type: array
              items: { $ref: '#/components/schemas/CapabilityPatternEvidence' }
            validated:
              type: array
              items: { $ref: '#/components/schemas/CapabilityPatternEvidence' }
        exactSkillVersionMappings:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              [exactSkillVersionRef, mappingBasis, requiresCurrentReadiness, compatibilityStatus]
            properties:
              exactSkillVersionRef: { type: string }
              mappingBasis: { const: declared_capability }
              requiresCurrentReadiness: { const: true }
              compatibilityStatus: { const: requires_current_check }
        requiresCurrentReadiness: { const: true }
        sourceRefs:
          type: array
          minItems: 1
