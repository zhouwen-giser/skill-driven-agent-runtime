    parameters:
      - { name: artifactId, in: path, required: true, schema: { type: string } }
      - {
          name: view,
          in: path,
          required: true,
          schema:
            {
              type: string,
              enum:
                [
                  versions,
                  diff,
                  lineage,
                  validation,
                  shadow,
                  promotion,
                  approvals,
                  activations,
                  usage,
                  outcomes,
                  drift,
                  audit,
                ],
            },
        }
    get:
      operationId: getManagedArtifactEvidenceView
      security: [{ CognitiveBearer: [] }]
      responses:
        '200': { description: Permission-trimmed Artifact evidence view }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
