openapi: 3.1.0
info:
  title: Skill-Driven Agent Runtime Management API
  version: 1.0.0-dev
  description: Unauthenticated V1 API for trusted-intranet deployments only.
servers:
  - url: http://127.0.0.1:9998
paths:
  /api/v1/tasks:
    get:
      operationId: listTasks
      parameters:
        - { name: contextId, in: query, required: false, schema: { type: string } }
        - { name: planId, in: query, required: false, schema: { type: string } }
        - { name: goalId, in: query, required: false, schema: { type: string } }
        - { name: skillId, in: query, required: false, schema: { type: string } }
        - { name: phase, in: query, required: false, schema: { type: string } }
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
      responses: { '200': { description: Most recently updated PostgreSQL Task records } }
  /api/v1/memories:
    post:
      operationId: createMemory
      description: Refines one globally shared candidate and persists it only when structured durability is durable; embeddings may use any positive provider dimension.
      responses:
        '201':
          { description: Active durable global memory item with authority and durability reason }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/runtime-terminal-outcomes/{outcomeId}:
    parameters: [{ name: outcomeId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getRuntimeTerminalOutcome
      description: Returns authoritative terminal state plus queryable post-commit enhancement warnings.
      responses:
        '200': { description: Terminal outcome and append-only Memory/quality/evolution warnings }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/memories/search:
    get:
      operationId: searchMemories
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          {
            description: Same-provider/same-dimension durable active memories ordered by pgvector similarity,
          }
  /api/v1/memories/{memoryId}:
    parameters: [{ name: memoryId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getMemory
      responses:
        '200': { description: One source-traceable memory item }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/contexts/{contextId}/goals:
    parameters: [{ name: contextId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: listContextGoalHistory
      description: Returns ordered Goals and fixed-stage relationship decisions for one context.
      responses:
        '200': { description: Goal history and related-successor/unrelated-new transition evidence }
  /api/v1/system/task-wait-policy:
    get:
      operationId: getTaskWaitPolicy
      responses:
        '200': { description: PostgreSQL-authoritative unified confirmation/input wait timeout }
    put:
      operationId: updateTaskWaitPolicy
      description: Changes the timeout applied to all current and future confirmation/input waits.
      responses:
        '200': { description: Updated wait policy }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/goals:
    post:
      operationId: createGoal
      responses:
        '201': { description: PostgreSQL-authoritative active Goal }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/goals/{goalId}:
    parameters: [{ name: goalId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getGoal
      responses:
        '200': { description: Current Goal record }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/goals/{goalId}/cancel:
    parameters: [{ name: goalId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: cancelGoal
      description: Applies active Workflow cancellation policies before atomically terminating all remaining Goal work.
      responses:
        '201': { description: Goal cancellation cascade and policy warnings }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/goals/{goalId}/cancellations:
    parameters: [{ name: goalId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: listGoalCancellations
      responses:
        '200': { description: Immutable Goal cancellation history }
  /api/v1/goal-cancellations/{cancellationId}:
    parameters: [{ name: cancellationId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getGoalCancellation
      responses:
        '200': { description: One Goal cancellation record }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/goals/{goalId}/patches:
    parameters: [{ name: goalId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: applyGoalPatch
      description: Applies a structured Goal version change, atomically invalidates all old-version execution state, and generates a fresh-confirmation plan.
      responses:
        '201': { description: Persisted Goal Patch evidence and new plan identity }
        '400': { $ref: '#/components/responses/Error' }
    get:
      operationId: listGoalPatches
      responses:
        '200': { description: Ordered immutable Goal Patch history }
  /api/v1/goal-patches/{patchId}:
    parameters: [{ name: patchId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getGoalPatch
      responses:
        '200':
          { description: Goal Patch before/after, invalidation, compensation, and plan evidence }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/tasks/{taskId}:
    parameters: [{ name: taskId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getTask
      responses:
        '200': { description: PostgreSQL-authoritative Task including its current plan binding }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/tasks/{taskId}/events:
    parameters: [{ name: taskId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: listTaskRuntimeEvents
      responses:
        '200': { description: Ordered displayable Task lifecycle events }
  /api/v1/tasks/{taskId}/skill-executions:
    parameters: [{ name: taskId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: listTaskSkillExecutions
      description: Returns the exact-version Skill execution evidence records for a Task, including parent/child tree, planning and lifecycle events, Task/Provider and remote binding references, thin EvidenceRefs, hard gates, and degraded reasons. Task and Workflow remain authoritative.
      responses:
        '200': { description: Ordered Skill execution evidence collection and tree }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/skill-executions/{executionId}:
    parameters: [{ name: executionId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getSkillExecution
      description: Returns one exact Skill execution record with its event timeline, evidence links, and containing parent/child tree.
      responses:
        '200': { description: Skill execution evidence detail }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/tasks/{taskId}/remote-task-lifecycle:
    parameters: [{ name: taskId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getTaskRemoteTaskLifecycle
      description: Returns the credential-free PostgreSQL-authoritative correlation from Agent Task through MCP capability, availability evidence, remote binding, observations, controls, continuation, input rounds, cancellation delivery/Provider-terminal separation, timing, protocol attempts, and final Provider result. Refreshing this resource only reloads evidence and does not fabricate a Provider state transition.
      responses:
        '200':
          {
            description: Remote Task lifecycle with trusted-intranet,
            Provider-authority,
            side-effect,
            non-recovery,
            and cancellation-uncertainty warnings,
          }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/remote-task-bindings/{bindingId}/refresh:
    parameters: [{ name: bindingId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: refreshRemoteTaskBinding
      description: Performs one bounded, version-CAS tasks/get observation through the same context-serialized polling service. The expectedVersion is mandatory; this action never fabricates a Provider transition.
      responses:
        '200':
          {
            description: Poll disposition; authoritative evidence is read from the lifecycle resource,
          }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/remote-task-bindings/{bindingId}/cancel:
    parameters: [{ name: bindingId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: cancelRemoteTaskBinding
      description: Creates an idempotent source=management cooperative cancellation request. Acknowledgement or uncertainty is not Provider terminal cancellation and observation continues.
      responses:
        '200':
          { description: Durable cancellation request disposition and delivery scheduling state }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/tasks/{taskId}/processed-results:
    parameters: [{ name: taskId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: listTaskProcessedResults
      responses:
        '200': { description: Normalized results, facts, value assessments and memory candidates }
  /api/v1/tasks/{taskId}/input-inferences:
    parameters: [{ name: taskId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: listTaskInputInferences
      responses:
        '200': { description: Ordered missing-input decisions and explainable evidence sources }
  /api/v1/tasks/{taskId}/skill-input-resolutions:
    parameters: [{ name: taskId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: listTaskSkillInputResolutions
      description: Returns immutable top-level Skill input decisions for every resolution attempt on the Task.
      responses:
        '200':
          {
            description: Ordered structured input,
            schema status,
            source references and decision summaries,
          }
  /api/v1/skill-input-resolutions/{resolutionId}:
    parameters: [{ name: resolutionId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getSkillInputResolution
      responses:
        '200': { description: One immutable top-level Skill input resolution record }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/processed-results/{resultId}:
    parameters: [{ name: resultId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getProcessedResult
      responses:
        '200': { description: One immutable processed-result record }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/tasks/{taskId}/plan:
    parameters: [{ name: taskId, in: path, required: true, schema: { type: string } }]
    put:
      operationId: attachTaskPlan
      description: Binds a real persisted plan to a Task at the planning/confirmation boundary.
      responses:
        '200': { description: Task with Goal and plan identity }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/tasks/{taskId}/actions:
    parameters: [{ name: taskId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: actOnTaskPlan
      description: Uses the same TaskService path as A2A follow-up messages. In addition to plan decisions, provide_input accepts an optional structured inputContent plus inputRequestId for a schema-validated remote form round; cancel_goal enters the authoritative local cancellation path and creates cooperative remote cancellation evidence for active bindings.
      responses:
        '200': { description: Authoritative Task state after the action }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/workflow-controls:
    post:
      operationId: startWorkflowControl
      description: Executes confirmed immutable plans and requires a structured Goal evaluation after every round. An optional taskId projects capability-gap evidence onto the authoritative A2A Task. Plan adjustment, Skill replacement, and additional-Skill decisions create new versions outside LangGraph; input and capability-gap decisions stop without starting another node.
      responses:
        '201':
          {
            description: Terminal,
            awaiting-confirmation,
            awaiting-input,
            or capability-gap Workflow control,
          }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/workflow-controls/{controlId}:
    parameters: [{ name: controlId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getWorkflowControl
      responses:
        '200': { description: Persisted outer-control state }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/workflow-controls/{controlId}/rounds:
    parameters: [{ name: controlId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: listWorkflowControlRounds
      responses:
        '200': { description: Ordered plan, instance, version and structured evaluation evidence }
  /api/v1/workflow-controls/{controlId}/continue:
    parameters: [{ name: controlId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: continueWorkflowControl
      responses:
        '200': { description: Continued control after current plan confirmation }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/workflows/validate:
    post:
      operationId: validateWorkflowDsl
      responses:
        '200': { description: Validated WorkflowDefinition }
        '422': { description: Structured errors; workflow is not executable }
  /api/v1/workflows/plan:
    post:
      operationId: planWorkflow
      description: Every standalone planning request carries one complete immutable Goal execution contract; a registered Goal must match it exactly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [
                  planId,
                  workflowDefinitionId,
                  workflowVersion,
                  goalId,
                  goalVersion,
                  goalContract,
                  planningInstruction,
                ]
              properties:
                planId: { type: string, minLength: 1 }
                workflowDefinitionId: { type: string, minLength: 1 }
                workflowVersion: { type: integer, minimum: 1 }
                goalId: { type: string, minLength: 1 }
                goalVersion: { type: integer, minimum: 1 }
                goalContract: { $ref: '#/components/schemas/GoalExecutionContract' }
                planningInstruction: { type: string, minLength: 1 }
                compositionRoot:
                  type: object
                  additionalProperties: false
                  required: [skillId, skillVersion]
                  properties:
                    skillId: { type: string, minLength: 1 }
                    skillVersion: { type: integer, minimum: 1 }
                sourceConfirmedPlanId: { type: string, minLength: 1 }
      responses:
        '201': { description: Immutable validated Workflow plan and confirmation status }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/workflows/plans/{planId}/confirm:
    parameters: [{ name: planId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: confirmWorkflowPlan
      responses:
        '200':
          {
            description: Confirmed immutable Workflow plan with persisted confirmation timestamp and optional triggering Task identity,
          }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/workflows/plans/{planId}/execute:
    parameters: [{ name: planId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: executeConfirmedWorkflowPlan
      description: Optional skillIds resolve current enabled Skill budget overrides; the immutable resolved limits and usage are returned on the Workflow instance.
      responses:
        '201': { description: Persisted terminal Workflow instance }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/workflows/plans/{planId}/pause:
    parameters: [{ name: planId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: pauseWorkflowExecution
      description: Requests an in-process LangGraph interrupt after the active node and before any subsequent node starts.
      responses:
        '200': { description: Persisted Task-pause checkpoint and boundary identity }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/workflows/plans/{planId}/resume:
    parameters: [{ name: planId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: resumeWorkflowExecution
      description: Resumes the same checkpoint below the Skill threshold; otherwise reports that replanning and fresh confirmation are required.
      responses:
        '200': { description: Resume disposition and Workflow instance }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/workflows/plans/{planId}/cancel:
    parameters: [{ name: planId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: cancelWorkflowExecution
      description: Applies the resolved Skill cancellation strategy, prevents subsequent nodes, and never performs automatic compensation.
      responses:
        '200': { description: Persisted canceled Workflow instance and policy audit }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/workflows/instances/{instanceId}/human-confirmation:
    parameters: [{ name: instanceId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: resumeWorkflowHumanConfirmation
      description: Resumes the same in-process LangGraph checkpoint. A missing checkpoint fails explicitly and is never replayed.
      responses:
        '200': { description: Resumed, paused-at-next-gate, or terminal Workflow instance }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/workflows/instances/{instanceId}:
    parameters: [{ name: instanceId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getWorkflowInstanceTrace
      description: Returns the immutable instance snapshot and ordered displayable node-event summaries, including persisted terminal-node duration when available.
      responses:
        '200': { description: Workflow instance and ordered node events for trace and replay }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/workflows/plans/{planId}:
    parameters: [{ name: planId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getWorkflowPlan
      responses:
        '200':
          {
            description: Immutable plan,
            revision lineage,
            confirmation status,
            timestamp,
            and optional triggering Task identity,
          }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/workflows/plans/{planId}/task-readiness:
    parameters: [{ name: planId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: listWorkflowTaskReadiness
      description: Returns append-only, time-bounded Provider forecasts and deterministic guard decisions. Forecasts are not locks or authoritative device state; full argument snapshots are not exposed.
      parameters:
        - { name: phase, in: query, schema: { type: string, enum: [planning, pre_invocation] } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 1000, default: 100 },
          }
      responses:
        '200':
          {
            description: Availability windows,
            expiry,
            reservation semantics,
            risk and guard evidence,
          }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/workflows/plans/{planId}/trace:
    parameters: [{ name: planId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getLatestWorkflowTraceForPlan
      responses:
        '200': { description: Latest immutable instance and ordered node events for the Plan }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/workflows/plans/{planId}/revisions:
    parameters: [{ name: planId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: reviseWorkflowPlanAsAdministrator
      description: Validates canonical DSL or DAG-editor serialization, atomically supersedes the source plan, and always returns the revision to awaiting confirmation.
      responses:
        '201': { description: Validated immutable revision with source lineage }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/prompts:
    post:
      operationId: createPromptVersion
      responses:
        {
          '201': { description: Candidate or enabled immutable PromptVersion },
          '400': { $ref: '#/components/responses/Error' },
        }
  /api/v1/prompts/{promptId}/versions:
    get:
      operationId: listPromptVersions
      responses: { '200': { description: Immutable Prompt version chain } }
  /api/v1/prompts/{promptId}/publish/{version}:
    post:
      operationId: publishPromptCandidate
      responses: { '200': { description: New enabled PromptVersion } }
  /api/v1/prompts/{promptId}/disable:
    post:
      operationId: disablePrompt
      responses: { '200': { description: New disabled PromptVersion } }
  /api/v1/prompts/{promptId}/rollback/{version}:
    post:
      operationId: rollbackPrompt
      responses: { '200': { description: New enabled rollback PromptVersion } }
  /api/v1/prompts/{promptId}/effects/{version}:
    get:
      operationId: getPromptEffect
      responses: { '200': { description: Invocation success/failure/duration/Token summary } }
  /api/v1/models/providers:
    get:
      operationId: listModelProviders
      description: Lists credential-free Provider configurations from PostgreSQL.
      responses: { '200': { description: Credential-free Provider inventory } }
  /api/v1/models/providers/{providerId}:
    parameters: [{ name: providerId, in: path, required: true, schema: { type: string } }]
    put:
      operationId: configureModelProvider
      description: Stores an AES-GCM encrypted credential and protocol-neutral Provider configuration. Provider kind is independent from the explicit HTTP API style.
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      additionalProperties: false,
                      required:
                        [
                          name,
                          kind,
                          apiStyle,
                          baseUrl,
                          model,
                          enabled,
                          timeoutMs,
                          credentialHeaders,
                        ],
                      properties:
                        {
                          name: { type: string },
                          kind: { enum: [openai_compatible, local, other_vendor] },
                          apiStyle: { enum: [openai_chat_completions, anthropic_messages] },
                          baseUrl: { type: string, format: uri },
                          model: { type: string },
                          enabled: { type: boolean },
                          timeoutMs: { type: integer, minimum: 1 },
                          credentialHeaders:
                            { type: object, additionalProperties: { type: string } },
                        },
                    },
                },
            },
        }
      responses:
        { '204': { description: Configured }, '400': { $ref: '#/components/responses/Error' } }
  /api/v1/models/routes:
    get:
      operationId: listModelStageRoutes
      responses: { '200': { description: Fixed model-stage route inventory } }
  /api/v1/models/routes/{stage}:
    parameters: [{ name: stage, in: path, required: true, schema: { type: string } }]
    put:
      operationId: routeModelStage
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [providerId],
                      properties: { providerId: { type: string } },
                    },
                },
            },
        }
      responses:
        {
          '204': { description: Fixed route configured },
          '400': { $ref: '#/components/responses/Error' },
        }
  /api/v1/models/invocations:
    get:
      operationId: listModelInvocations
      parameters:
        - { name: stage, in: query, required: false, schema: { type: string } }
        - { name: taskId, in: query, required: false, schema: { type: string, minLength: 1 } }
      responses: { '200': { description: Sanitized model invocation audits } }
  /api/v1/health:
    get:
      operationId: getHealth
      responses:
        '200':
          {
            description: Health,
            deployment risk marker,
            and indefinite/no-automatic-cleanup V1 retention posture,
          }
  /api/v1/mcp/invocations:
    get:
      operationId: listTaskMcpInvocations
      parameters:
        - { name: taskId, in: query, required: true, schema: { type: string, minLength: 1 } }
      responses:
        '200': { description: Sanitized MCP invocation audits linked to the Task }
  /api/v1/mcp/servers:
    get:
      operationId: listMcpServers
      responses:
        '200': { description: Credential-free MCP Server list }
    post:
      operationId: registerMcpServer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterMcpServer' }
      responses:
        '201': { description: Registered Server and discovered Tools }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/mcp/servers/{serverId}:
    parameters: [{ $ref: '#/components/parameters/ServerId' }]
    delete:
      operationId: deleteMcpServer
      responses:
        '204': { description: Deleted }
  /api/v1/mcp/servers/{serverId}/refresh:
    parameters: [{ $ref: '#/components/parameters/ServerId' }]
    post:
      operationId: refreshMcpServer
      responses:
        '200': { description: Refreshed Tools and dependency changes }
  /api/v1/mcp/servers/{serverId}/protocol:
    parameters: [{ $ref: '#/components/parameters/ServerId' }]
    get:
      operationId: diagnoseMcpServerProtocol
      description: Returns the current PostgreSQL discovery snapshot, supported versions, frozen baseline hash, Task Notification capability, per-Tool task behavior and output-schema hashes without credentials.
      responses:
        '200': { description: Current Provider protocol execution evidence and fallback warnings }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/mcp/servers/{serverId}/protocol-baseline-audit:
    parameters: [{ $ref: '#/components/parameters/ServerId' }]
    post:
      operationId: auditMcpServerProtocolBaseline
      description: Compares the persisted Provider discovery baseline SHA-256 to the frozen SDAR baseline without refreshing or mutating Provider state.
      responses:
        '200': { description: Expected/actual baseline hashes and audit disposition }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/mcp/servers/{serverId}/mode-switch-guard:
    parameters: [{ $ref: '#/components/parameters/ServerId' }]
    post:
      operationId: guardMcpServerProtocolModeSwitch
      description: Fails closed for any attempt to change an existing Provider between Legacy and Frozen handlers; registering a new explicit Provider identity is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetMode]
              additionalProperties: false
              properties:
                targetMode: { enum: [legacy_v11, frozen_v1] }
      responses:
        '200': { description: Target is the already persisted mode }
        '409': { description: Immutable Provider mode blocks the requested switch }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/mcp/servers/{serverId}/health:
    parameters: [{ $ref: '#/components/parameters/ServerId' }]
    post:
      operationId: checkMcpServerHealth
      responses:
        '200': { description: Remote protocol health, status, and duration }
  /api/v1/mcp/servers/{serverId}/credentials:
    parameters: [{ $ref: '#/components/parameters/ServerId' }]
    put:
      operationId: updateMcpServerCredentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credentialHeaders]
              properties:
                credentialHeaders: { type: object, additionalProperties: { type: string } }
      responses:
        '204': { description: Remotely validated and encrypted credentials updated }
  /api/v1/mcp/servers/{serverId}/tools:
    parameters: [{ $ref: '#/components/parameters/ServerId' }]
    get:
      operationId: listMcpTools
      responses:
        '200': { description: Current original schemas and enhancements }
  /api/v1/mcp/servers/{serverId}/tools/{toolName}/enhancement:
    parameters:
      - $ref: '#/components/parameters/ServerId'
      - { name: toolName, in: path, required: true, schema: { type: string } }
    put:
      operationId: updateMcpToolEnhancement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ToolEnhancement' }
      responses:
        '204': { description: Updated }
  /api/v1/mcp/servers/{serverId}/tools/{toolName}/execution-semantics:
    parameters:
      - $ref: '#/components/parameters/ServerId'
      - { name: toolName, in: path, required: true, schema: { type: string } }
    put:
      operationId: updateMcpToolExecutionSemantics
      description: Retains a credential-free administrator semantics override across discovery refreshes. An available MCP declaration remains authoritative.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/McpToolExecutionSemanticsValues' }
      responses:
        '204': { description: Override retained and effective semantics recalculated }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/mcp/servers/{serverId}/invocations:
    parameters: [{ $ref: '#/components/parameters/ServerId' }]
    get:
      operationId: listMcpInvocations
      responses:
        '200': { description: Replayable invocation summaries }
  /api/v1/mcp/servers/{serverId}/operations:
    parameters: [{ $ref: '#/components/parameters/ServerId' }]
    get:
      operationId: listMcpManagementOperations
      description: Returns credential-safe, append-only administrator operation evidence.
      responses:
        '200':
          {
            description: MCP registration,
            refresh,
            health,
            credential,
            metadata,
            and deletion operations,
          }
  /api/v1/mcp/servers/{serverId}/warnings:
    parameters: [{ $ref: '#/components/parameters/ServerId' }]
    get:
      operationId: listMcpDependencyWarnings
      responses:
        '200': { description: Skill dependency warnings }
  /api/v1/skills:
    get:
      operationId: listCurrentSkillVersions
      responses:
        '200': { description: Current Skill versions }
    post:
      operationId: registerSkillVersion
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '201': { description: New current Skill version }
  /api/v1/skills/catalog:
    get:
      operationId: listSkillUsageCatalog
      description: Lists immutable current usage summaries with exact lifecycle, visibility, mode, domain, and tag filters.
      parameters:
        - { name: lifecycle, in: query, schema: { type: string } }
        - { name: mode, in: query, schema: { enum: [guidance, template, procedure] } }
        - { name: domain, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: userSelectable, in: query, schema: { type: boolean } }
        - { name: composable, in: query, schema: { type: boolean } }
        - { name: internalOnly, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Filtered exact current Skill usage summaries }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/skill-packages/validate:
    post:
      operationId: validateSkillPackage
      description: Reads and validates a bounded server-local Skill Package without publishing it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [packageRoot]
              properties: { packageRoot: { type: string, minLength: 1, maxLength: 4096 } }
      responses:
        '200': { description: Validated immutable import candidate metadata }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/skill-packages/import:
    post:
      operationId: importSkillPackage
      description: Revalidates and atomically publishes a package as the exact next Skill version with import audit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [packageRoot]
              properties: { packageRoot: { type: string, minLength: 1, maxLength: 4096 } }
      responses:
        '201': { description: Persisted exact Skill version }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/skills/author:
    post:
      operationId: authorAndRegisterSkill
      description: Uses the configured structured ModelProvider; never falls back to a placeholder Schema.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '201': { description: Model-authored, validated, persisted SkillVersion }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/skill-selections:
    post:
      operationId: selectSkill
      description: Builds pgvector and operational-metric candidates, then requires a configured final decider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [goalContract]
              properties:
                goalContract: { $ref: '#/components/schemas/GoalExecutionContract' }
      responses:
        '201':
          {
            description: Persisted selection,
            candidate metric snapshots,
            and displayable decision summary,
          }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/skill-graph:
