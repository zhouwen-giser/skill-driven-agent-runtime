      - {
          name: view,
          in: path,
          required: true,
          schema: { type: string, enum: [decisions, model-usage, case-usage] },
        }
      - { name: cursor, in: query, schema: { type: string } }
      - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
    get:
      operationId: getArtifactRuntimeManagementView
      security: [{ CognitiveBearer: [] }]
      responses:
        '200': { description: Tenant-scoped Gateway, Case or Model runtime evidence }
