        '404': { $ref: '#/components/responses/Error' }
  /api/v1/skill-formalization-candidates/{candidateId}/simulate:
    parameters: [{ $ref: '#/components/parameters/CandidateId' }]
    post:
      operationId: simulateSkillFormalizationCandidate
      responses:
        '200': { description: Five-part simulation report and publication decision }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/skill-formalization-candidates/{candidateId}/corrections:
    parameters: [{ $ref: '#/components/parameters/CandidateId' }]
    get:
      operationId: listSkillFormalizationCorrections
