openapi: 3.1.0
info:
  title: Skill-Driven Agent Runtime Management API
  version: 1.0.0-dev
  description: Trusted-intranet V1 API with an optional deployment-configured bearer guard for cognitive management writes.
servers:
  - url: http://127.0.0.1:9998
paths:
  /api/v1/business-events/providers/{serverId}/health:
    parameters: [{ name: serverId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getBusinessEventProviderHealth
      description: Returns the isolated Provider-level Business Event subscription health and reconnect counters.
      responses: { '200': { description: Feature status and Provider subscription health } }
  /api/v1/business-events/providers/{serverId}/reconnect:
    parameters: [{ name: serverId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: reconnectBusinessEventProvider
      description: Starts or confirms the explicitly enabled Provider-level Business Event subscription.
      responses:
        '202': { description: Subscription coordinator disposition }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/business-events/subscriptions:
    get:
      operationId: listBusinessEventSubscriptions
      parameters: [{ $ref: '#/components/parameters/BoundedListLimit' }]
      responses:
        {
          '200':
            { description: Durable generation state and independent admitted/processed cursors },
        }
  /api/v1/business-events/inbox:
    get:
      operationId: listBusinessEventInbox
      parameters: [{ $ref: '#/components/parameters/BoundedListLimit' }]
      responses:
        { '200': { description: PostgreSQL-authoritative durable Business Event Inbox records } }
  /api/v1/business-events/impact-assessments:
    get:
      operationId: listBusinessEventImpactAssessments
      parameters: [{ $ref: '#/components/parameters/BoundedListLimit' }]
      responses:
        { '200': { description: Rule/semantic impact decisions traced to User Goal criteria } }
  /api/v1/business-events/incidents:
    get:
      operationId: listBusinessEventIncidents
      parameters: [{ $ref: '#/components/parameters/BoundedListLimit' }]
      responses: { '200': { description: Deduplicated continuity and cross-Goal incidents } }
  /api/v1/artifacts/promotion/approvals:
    post:
      operationId: recordArtifactPromotionApproval
      description: Records a trusted human approval bound to an exact P06 Promotion Package hash. Worker and LLM identities are rejected.
      responses:
        '201':
          {
            description: Immutable ArtifactApprovalRecord persisted with validation and promotion hashes,
          }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/artifacts/promotions/activate:
    post:
      operationId: activateApprovedArtifactPromotion
      description: Activates an approved P06 package with a single PostgreSQL CAS transaction; this is not a Fast Gateway route.
      responses:
        '201': { description: Immutable ArtifactActivationRecord and transactional outbox event }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/artifacts/revalidations:
    post:
      operationId: requestArtifactRevalidation
      description: Creates a P02-authoritative revalidation run and records the associated P06 trigger. It cannot reactivate an Artifact or invoke a Fast Gateway path.
      responses:
        '202':
          {
            description: Artifact removed from future active projection and queued for fresh validation evidence,
          }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/tasks:
    get:
      operationId: listTasks
      parameters:
        - { name: contextId, in: query, required: false, schema: { type: string } }
        - { name: planId, in: query, required: false, schema: { type: string } }
        - { name: goalId, in: query, required: false, schema: { type: string } }
        - { name: skillId, in: query, required: false, schema: { type: string } }
        - { name: phase, in: query, required: false, schema: { type: string } }
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
      responses: { '200': { description: Most recently updated PostgreSQL Task records } }
  /api/v1/tasks/{taskId}/understanding:
    parameters: [{ name: taskId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getTaskUnderstanding
      description: Returns the current source-traceable Generic Task Understanding revision.
      responses:
        '200':
          description: Current Task Understanding revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericTaskUnderstanding' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/tasks/{taskId}/understanding/revisions:
    parameters: [{ name: taskId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: listTaskUnderstandingRevisions
      description: Returns immutable Task Understanding revisions in ascending revision order.
      responses:
        '200':
          description: Task Understanding revision history
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/GenericTaskUnderstanding' }
  /api/v1/tasks/{taskId}/goal-session:
    parameters: [{ name: taskId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getInteractiveGoalSession
      description: Returns the PostgreSQL-authoritative interactive Goal session, current question, and candidate contract.
      responses:
        '200':
          description: Current interactive Goal session view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InteractiveGoalSessionView' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/tasks/{taskId}/goal-session/actions:
    parameters: [{ name: taskId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: applyInteractiveGoalAction
      security: [{ CognitiveBearer: [] }, {}]
      description: Applies one actor-attributed, CAS-protected and idempotent interaction action.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InteractiveGoalAction' }
      responses:
        '200':
          description: Updated interactive Goal session view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InteractiveGoalSessionView' }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/tasks/{taskId}/planning-session:
    parameters: [{ name: taskId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getInteractivePlanningSession
      description: Returns the PostgreSQL-authoritative candidate Skill Goal DAG, validation, Plan Diff, display-only Experience Hints, and confirmation policy.
      responses:
        '200':
          description: Current interactive planning session view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InteractivePlanningSessionView' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/tasks/{taskId}/planning-session/actions:
    parameters: [{ name: taskId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: applyInteractivePlanningAction
      security: [{ CognitiveBearer: [] }, {}]
      description: Applies one actor-attributed, CAS-protected and idempotent accept, patch, reject, or cancel action. Only a confirmed valid candidate is handed to the authoritative v1.2.2 planner.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InteractivePlanningAction' }
      responses:
        '200':
          description: Updated interactive planning session view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InteractivePlanningSessionView' }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/tasks/{taskId}/planning-interactions:
    parameters: [{ name: taskId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getPlanningInteractions
      description: Returns immutable Planning Correction Facts and Interaction Episode revisions for one Task. Memory projections are not authority.
      responses:
        '200':
          description: Planning corrections and immutable episode revisions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanningInteractionsResponse' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/users/{userId}/planning-preferences:
    parameters: [{ name: userId, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: deleteUserPlanningPreferences
      description: Invalidates rebuildable user-scoped low-risk planning-preference Memory projections. Authoritative correction history remains immutable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [actorId]
              properties:
                actorId: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200':
          description: Number of scoped projections invalidated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [deleted]
                properties:
                  deleted: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/experience/episodes:
    get:
      operationId: listGoalExperienceEpisodes
      description: Lists immutable Goal Experience Episodes built asynchronously from persisted Runtime facts. Experience is advisory.
      parameters:
        - { name: goalId, in: query, required: false, schema: { type: string } }
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 500, default: 100 },
          }
      responses:
        '200':
          description: Immutable Goal Experience Episodes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoalExperienceEpisodeList' }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/experience/episodes/{episodeId}:
    parameters: [{ name: episodeId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getGoalExperienceEpisode
      description: Returns one immutable Goal Experience Episode by authoritative identity.
      responses:
        '200': { description: Immutable Goal Experience Episode }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/experience/dead-letters:
    get:
      operationId: listExperienceDeadLetters
      description: Lists inspectable exhausted PostgreSQL Experience jobs without exposing credentials or private reasoning.
      parameters:
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 500, default: 100 },
          }
      responses:
        '200':
          description: Experience dead letters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExperienceDeadLetterList' }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/experience/observations:
    get:
      operationId: listExperienceObservations
      description: Lists immutable source-linked structured Observations. Facts, inferences and candidate lessons remain advisory.
      parameters:
        - { name: goalId, in: query, required: false, schema: { type: string } }
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 500, default: 100 },
          }
      responses:
        '200':
          description: Immutable Experience Observations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExperienceObservationList' }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/experience/reflections:
    get:
      operationId: listExperienceReflections
      description: Lists immutable candidate-only Reflection, identity, Delta and positive/negative evidence lineage. No item is active knowledge.
      parameters:
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 500, default: 100 },
          }
      responses:
        '200':
          description: Immutable Experience Reflections
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExperienceReflectionList' }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/task-types:
    get:
      operationId: listTaskTypes
      description: Lists versioned fixture or induced Task Type Candidate definitions. Candidate status is advisory and cannot enter formal Understanding before governed promotion.
      parameters:
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 500, default: 100 },
          }
      responses:
        '200':
          description: Versioned Task Type Candidate definitions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskTypeDefinitionList' }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/knowledge/heuristics:
    get:
      operationId: listPlanningHeuristics
      description: Lists versioned Planning Heuristic candidates and active revisions for governance review.
      parameters: [{ $ref: '#/components/parameters/BoundedListLimit' }]
      responses:
        '200': { description: Planning Heuristic governance inventory }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/cognitive-management/actions:
    get:
      operationId: listCognitiveManagementActions
      description: Lists PostgreSQL-authoritative actor, reason, CAS, idempotency and terminal result audit for cognitive writes.
      parameters: [{ $ref: '#/components/parameters/BoundedListLimit' }]
      responses:
        '200':
          description: Cognitive management action audit inventory
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CognitiveManagementActionRecord' }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/capability-patterns:
    get:
      operationId: listCapabilityPatterns
      description: Lists versioned Candidate Capability Patterns and non-executable Gap Candidates. Exact Skill mappings never assert current readiness or compatibility, and Gap proposals cannot publish Skills.
      parameters:
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 500, default: 100 },
          }
      responses:
        '200':
          description: Candidate Capability Patterns and Gap Candidates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilityPatternList' }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/knowledge/{kind}/{knowledgeId}/promote:
    parameters:
      - {
          name: kind,
          in: path,
          required: true,
          schema: { $ref: '#/components/schemas/KnowledgeKind' },
        }
      - { name: knowledgeId, in: path, required: true, schema: { type: string, minLength: 1 } }
    post:
      operationId: promoteKnowledge
      security: [{ CognitiveBearer: [] }, {}]
      description: Deterministically evaluates one exact Candidate revision under CAS. First-release activation always requires explicit human approval; high-risk activation also requires persisted replay, shadow and policy allow gates.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgePromoteAction' }
      responses:
        '200':
          description: Promotion Evaluation and resulting Knowledge status
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/knowledge/{kind}/{knowledgeId}/reject:
    parameters:
      - {
          name: kind,
          in: path,
          required: true,
          schema: { $ref: '#/components/schemas/KnowledgeKind' },
        }
      - { name: knowledgeId, in: path, required: true, schema: { type: string, minLength: 1 } }
    post:
      operationId: rejectKnowledge
      security: [{ CognitiveBearer: [] }, {}]
      description: Records an actor-attributed terminal rejection for one Candidate revision without invoking Skill publication.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeRejectAction' }
      responses:
        '200':
          description: Rejected Knowledge revision
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/knowledge/{kind}/{knowledgeId}/revalidate:
    parameters:
      - {
          name: kind,
          in: path,
          required: true,
          schema: { $ref: '#/components/schemas/KnowledgeKind' },
        }
      - { name: knowledgeId, in: path, required: true, schema: { type: string, minLength: 1 } }
    post:
      operationId: revalidateKnowledge
      security: [{ CognitiveBearer: [] }, {}]
      description: CAS-transitions Active Knowledge back to validating after contradiction, catalog, policy or exact Skill-version change and removes its rebuildable Memory projection.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeRevalidateAction' }
      responses:
        '200':
          description: Validating Knowledge revision
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/knowledge/{kind}/{knowledgeId}/deprecate:
    parameters:
      - {
          name: kind,
          in: path,
          required: true,
          schema: { $ref: '#/components/schemas/KnowledgeKind' },
        }
      - { name: knowledgeId, in: path, required: true, schema: { type: string, minLength: 1 } }
    post:
      operationId: deprecateKnowledge
      security: [{ CognitiveBearer: [] }, {}]
      description: Manually deprecates Active Knowledge under CAS and invalidates its rebuildable Memory search projection.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeDeprecateAction' }
      responses:
        '200':
          description: Deprecated Knowledge revision
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/experience/dead-letters/{deadLetterId}/replay:
    parameters: [{ name: deadLetterId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: replayExperienceDeadLetter
      security: [{ CognitiveBearer: [] }, {}]
      description: Manually resets an exhausted PostgreSQL Experience job and emits a rebuildable Redis wake reference.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CognitiveWriteAction' }
      responses:
        '200':
          description: Replayed PostgreSQL Experience job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExperienceJob' }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/memories:
    post:
      operationId: createMemory
      description: Refines one globally shared candidate and persists it only when structured durability is durable; embeddings may use any positive provider dimension.
      responses:
        '201':
          { description: Active durable global memory item with authority and durability reason }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/runtime-terminal-outcomes/{outcomeId}:
    parameters: [{ name: outcomeId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getRuntimeTerminalOutcome
      description: Returns authoritative terminal state plus queryable post-commit enhancement warnings.
      responses:
        '200': { description: Terminal outcome and append-only Memory/quality/evolution warnings }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/memories/search:
    get:
      operationId: searchMemories
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          {
            description: Same-provider/same-dimension durable active memories ordered by pgvector similarity,
          }
  /api/v1/memories/{memoryId}:
    parameters: [{ name: memoryId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getMemory
      responses:
        '200': { description: One source-traceable memory item }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/contexts/{contextId}/goals:
    parameters: [{ name: contextId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: listContextGoalHistory
      description: Returns ordered Goals and fixed-stage relationship decisions for one context.
      responses:
        '200': { description: Goal history and related-successor/unrelated-new transition evidence }
  /api/v1/system/task-wait-policy:
    get:
      operationId: getTaskWaitPolicy
      responses:
        '200': { description: PostgreSQL-authoritative unified confirmation/input wait timeout }
    put:
      operationId: updateTaskWaitPolicy
      description: Changes the timeout applied to all current and future confirmation/input waits.
      responses:
        '200': { description: Updated wait policy }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/goals:
    post:
      operationId: createGoal
      responses:
        '201': { description: PostgreSQL-authoritative active Goal }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/goals/{goalId}:
    parameters: [{ name: goalId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getGoal
      responses:
        '200': { description: Current Goal record }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/goals/{goalId}/user-goal-plan:
    parameters:
      - { name: goalId, in: path, required: true, schema: { type: string } }
      - { name: goalVersion, in: query, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getCurrentUserGoalPlan
      description: Projects the immutable Skill Goal DAG, layered judgments, completed effects and latest progress for one Goal version.
      responses:
        '200':
          { description: Current User Goal Plan authority or null when planning has not started }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/goals/{goalId}/cancel:
    parameters: [{ name: goalId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: cancelGoal
      description: Applies active Workflow cancellation policies before atomically terminating all remaining Goal work.
      responses:
        '201': { description: Goal cancellation cascade and policy warnings }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/goals/{goalId}/cancellations:
    parameters: [{ name: goalId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: listGoalCancellations
      responses:
        '200': { description: Immutable Goal cancellation history }
  /api/v1/goal-cancellations/{cancellationId}:
    parameters: [{ name: cancellationId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getGoalCancellation
      responses:
        '200': { description: One Goal cancellation record }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/goals/{goalId}/patches:
    parameters: [{ name: goalId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: applyGoalPatch
      description: Applies a structured Goal version change, atomically invalidates all old-version execution state, and generates a fresh-confirmation plan.
      responses:
        '201': { description: Persisted Goal Patch evidence and new plan identity }
        '400': { $ref: '#/components/responses/Error' }
    get:
      operationId: listGoalPatches
      responses:
        '200': { description: Ordered immutable Goal Patch history }
  /api/v1/goal-patches/{patchId}:
    parameters: [{ name: patchId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getGoalPatch
      responses:
        '200':
          { description: Goal Patch before/after, invalidation, compensation, and plan evidence }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/tasks/{taskId}:
    parameters: [{ name: taskId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getTask
      responses:
        '200': { description: PostgreSQL-authoritative Task including its current plan binding }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/tasks/{taskId}/events:
    parameters: [{ name: taskId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: listTaskRuntimeEvents
      responses:
        '200': { description: Ordered displayable Task lifecycle events }
  /api/v1/tasks/{taskId}/gateway-evidence:
    parameters: [{ name: taskId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getTaskGatewayEvidence
      description: Returns the bounded, read-only P10 Gateway route, stage, reason, formal handoff, fallback, and Outbox correlation projection. It does not expose request text, credentials, private reasoning, or a second Task/Goal/Plan authority.
      responses:
        '200': { description: PostgreSQL-authoritative Gateway decision evidence }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/artifacts/runtime-evidence/{requestRef}:
    parameters: [{ name: requestRef, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getArtifactRuntimeEvidence
      description: Returns bounded, read-only P11 Case match/adaptation and Model Route/Cascade evidence. Credentials, secrets, complete sensitive prompts, and private reasoning are never projected.
      responses:
        '200': { description: PostgreSQL-authoritative P11 runtime evidence }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/tasks/{taskId}/skill-executions:
    parameters: [{ name: taskId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: listTaskSkillExecutions
      description: Returns the exact-version Skill execution evidence records for a Task, including parent/child tree, planning and lifecycle events, Task/Provider and remote binding references, thin EvidenceRefs, hard gates, and degraded reasons. Task and Workflow remain authoritative.
      responses:
        '200': { description: Ordered Skill execution evidence collection and tree }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/skill-executions/{executionId}:
    parameters: [{ name: executionId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getSkillExecution
      description: Returns one exact Skill execution record with its event timeline, evidence links, and containing parent/child tree.
      responses:
        '200': { description: Skill execution evidence detail }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/tasks/{taskId}/remote-task-lifecycle:
    parameters: [{ name: taskId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getTaskRemoteTaskLifecycle
      description: Returns the credential-free PostgreSQL-authoritative correlation from Agent Task through MCP capability, availability evidence, remote binding, observations, controls, continuation, input rounds, cancellation delivery/Provider-terminal separation, timing, protocol attempts, and final Provider result. Refreshing this resource only reloads evidence and does not fabricate a Provider state transition.
      responses:
        '200':
          {
            description: Remote Task lifecycle with trusted-intranet,
            Provider-authority,
            side-effect,
            non-recovery,
            and cancellation-uncertainty warnings,
          }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/remote-task-bindings/{bindingId}/refresh:
    parameters: [{ name: bindingId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: refreshRemoteTaskBinding
      description: Performs one bounded, version-CAS tasks/get observation through the same context-serialized polling service. The expectedVersion is mandatory; this action never fabricates a Provider transition.
      responses:
        '200':
          {
            description: Poll disposition; authoritative evidence is read from the lifecycle resource,
          }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/remote-task-bindings/{bindingId}/cancel:
    parameters: [{ name: bindingId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: cancelRemoteTaskBinding
      description: Creates an idempotent source=management cooperative cancellation request. Acknowledgement or uncertainty is not Provider terminal cancellation and observation continues.
      responses:
        '200':
          { description: Durable cancellation request disposition and delivery scheduling state }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/tasks/{taskId}/processed-results:
    parameters: [{ name: taskId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: listTaskProcessedResults
      responses:
        '200': { description: Normalized results, facts, value assessments and memory candidates }
  /api/v1/tasks/{taskId}/input-inferences:
    parameters: [{ name: taskId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: listTaskInputInferences
      responses:
        '200': { description: Ordered missing-input decisions and explainable evidence sources }
  /api/v1/tasks/{taskId}/skill-input-resolutions:
    parameters: [{ name: taskId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: listTaskSkillInputResolutions
      description: Returns immutable top-level Skill input decisions for every resolution attempt on the Task.
      responses:
        '200':
          {
            description: Ordered structured input,
            schema status,
            source references and decision summaries,
          }
  /api/v1/skill-input-resolutions/{resolutionId}:
    parameters: [{ name: resolutionId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getSkillInputResolution
      responses:
        '200': { description: One immutable top-level Skill input resolution record }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/processed-results/{resultId}:
    parameters: [{ name: resultId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getProcessedResult
      responses:
        '200': { description: One immutable processed-result record }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/tasks/{taskId}/plan:
    parameters: [{ name: taskId, in: path, required: true, schema: { type: string } }]
    put:
      operationId: attachTaskPlan
      description: Binds a real persisted plan to a Task at the planning/confirmation boundary.
      responses:
        '200': { description: Task with Goal and plan identity }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/tasks/{taskId}/actions:
    parameters: [{ name: taskId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: actOnTaskPlan
      description: Uses the same TaskService path as A2A follow-up messages. In addition to plan decisions, provide_input accepts an optional structured inputContent plus inputRequestId for a schema-validated remote form round; cancel_goal enters the authoritative local cancellation path and creates cooperative remote cancellation evidence for active bindings.
      responses:
        '200': { description: Authoritative Task state after the action }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/workflow-controls:
    post:
      operationId: startWorkflowControl
      description: Executes confirmed immutable plans and requires a structured Goal evaluation after every round. An optional taskId projects capability-gap evidence onto the authoritative A2A Task. Plan adjustment, Skill replacement, and additional-Skill decisions create new versions outside LangGraph; input and capability-gap decisions stop without starting another node.
      responses:
        '201':
          {
            description: Terminal,
            awaiting-confirmation,
            awaiting-input,
            or capability-gap Workflow control,
          }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/workflow-controls/{controlId}:
    parameters: [{ name: controlId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getWorkflowControl
      responses:
        '200': { description: Persisted outer-control state }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/workflow-controls/{controlId}/rounds:
    parameters: [{ name: controlId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: listWorkflowControlRounds
      responses:
        '200': { description: Ordered plan, instance, version and structured evaluation evidence }
  /api/v1/workflow-controls/{controlId}/continue:
    parameters: [{ name: controlId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: continueWorkflowControl
      responses:
        '200': { description: Continued control after current plan confirmation }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/capability-executions/deterministic:
    post:
      operationId: executeDeterministicCapability
      security: [{ CognitiveBearer: [] }]
      description: Executes one exact admitted deterministic read-only Capability contract. A durable replay of the same bounded Idempotency-Key and request body returns the byte-identical canonical JSON response with status 201 without executing the Capability again.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Collection-scoped key, trimmed before validation; the same key cannot be reused with a different request body.
          schema: { type: string, minLength: 1, maxLength: 256 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeterministicCapabilityExecutionRequest' }
      responses:
        '201':
          description: Fresh deterministic execution or byte-identical durable replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeterministicCapabilityExecutionResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/workflows/validate:
    post:
      operationId: validateWorkflowDsl
      responses:
        '200': { description: Validated WorkflowDefinition }
        '422': { description: Structured errors; workflow is not executable }
  /api/v1/workflows/plan:
    post:
      operationId: planWorkflow
      description: Every standalone planning request carries one complete immutable Goal execution contract; a registered Goal must match it exactly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [
                  planId,
                  workflowDefinitionId,
                  workflowVersion,
                  goalId,
                  goalVersion,
                  goalContract,
                  planningInstruction,
                ]
              properties:
                planId: { type: string, minLength: 1 }
                workflowDefinitionId: { type: string, minLength: 1 }
                workflowVersion: { type: integer, minimum: 1 }
                goalId: { type: string, minLength: 1 }
                goalVersion: { type: integer, minimum: 1 }
                goalContract: { $ref: '#/components/schemas/GoalExecutionContract' }
                planningInstruction: { type: string, minLength: 1 }
                compositionRoot:
                  type: object
                  additionalProperties: false
                  required: [skillId, skillVersion]
                  properties:
                    skillId: { type: string, minLength: 1 }
                    skillVersion: { type: integer, minimum: 1 }
                sourceConfirmedPlanId: { type: string, minLength: 1 }
      responses:
        '201': { description: Immutable validated Workflow plan and confirmation status }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/workflows/plans/{planId}/confirm:
    parameters: [{ name: planId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: confirmWorkflowPlan
      responses:
        '200':
          {
            description: Confirmed immutable Workflow plan with persisted confirmation timestamp and optional triggering Task identity,
          }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/workflows/plans/{planId}/execute:
    parameters: [{ name: planId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: executeConfirmedWorkflowPlan
      description: Optional skillIds resolve current enabled Skill budget overrides; the immutable resolved limits and usage are returned on the Workflow instance.
      responses:
        '201': { description: Persisted terminal Workflow instance }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/workflows/plans/{planId}/pause:
    parameters: [{ name: planId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: pauseWorkflowExecution
      description: Requests an in-process LangGraph interrupt after the active node and before any subsequent node starts.
      responses:
        '200': { description: Persisted Task-pause checkpoint and boundary identity }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/workflows/plans/{planId}/resume:
    parameters: [{ name: planId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: resumeWorkflowExecution
      description: Resumes the same checkpoint below the Skill threshold; otherwise reports that replanning and fresh confirmation are required.
      responses:
        '200': { description: Resume disposition and Workflow instance }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/workflows/plans/{planId}/cancel:
    parameters: [{ name: planId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: cancelWorkflowExecution
      description: Applies the resolved Skill cancellation strategy, prevents subsequent nodes, and never performs automatic compensation.
      responses:
        '200': { description: Persisted canceled Workflow instance and policy audit }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/workflows/instances/{instanceId}/human-confirmation:
    parameters: [{ name: instanceId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: resumeWorkflowHumanConfirmation
      description: Resumes the same in-process LangGraph checkpoint. A missing checkpoint fails explicitly and is never replayed.
      responses:
        '200': { description: Resumed, paused-at-next-gate, or terminal Workflow instance }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/workflows/instances/{instanceId}:
    parameters: [{ name: instanceId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getWorkflowInstanceTrace
      description: Returns the immutable instance snapshot and ordered displayable node-event summaries, including persisted terminal-node duration when available.
      responses:
        '200': { description: Workflow instance and ordered node events for trace and replay }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/workflows/plans/{planId}:
    parameters: [{ name: planId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getWorkflowPlan
      responses:
        '200':
          {
            description: Immutable plan,
            revision lineage,
            confirmation status,
            timestamp,
            and optional triggering Task identity,
          }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/workflows/plans/{planId}/task-readiness:
    parameters: [{ name: planId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: listWorkflowTaskReadiness
      description: Returns append-only, time-bounded Provider forecasts and deterministic guard decisions. Forecasts are not locks or authoritative device state; full argument snapshots are not exposed.
      parameters:
        - { name: phase, in: query, schema: { type: string, enum: [planning, pre_invocation] } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 1000, default: 100 },
          }
      responses:
        '200':
          {
            description: Availability windows,
            expiry,
            reservation semantics,
            risk and guard evidence,
          }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/workflows/plans/{planId}/trace:
    parameters: [{ name: planId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getLatestWorkflowTraceForPlan
      responses:
        '200': { description: Latest immutable instance and ordered node events for the Plan }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/workflows/plans/{planId}/revisions:
    parameters: [{ name: planId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: reviseWorkflowPlanAsAdministrator
      description: Validates canonical DSL or DAG-editor serialization, atomically supersedes the source plan, and always returns the revision to awaiting confirmation.
      responses:
        '201': { description: Validated immutable revision with source lineage }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/prompts:
    post:
      operationId: createPromptVersion
      responses:
        {
          '201': { description: Candidate or enabled immutable PromptVersion },
          '400': { $ref: '#/components/responses/Error' },
        }
  /api/v1/prompts/{promptId}/versions:
    get:
      operationId: listPromptVersions
      responses: { '200': { description: Immutable Prompt version chain } }
  /api/v1/prompts/{promptId}/publish/{version}:
    post:
      operationId: publishPromptCandidate
      responses: { '200': { description: New enabled PromptVersion } }
  /api/v1/prompts/{promptId}/disable:
    post:
      operationId: disablePrompt
      responses: { '200': { description: New disabled PromptVersion } }
  /api/v1/prompts/{promptId}/rollback/{version}:
    post:
      operationId: rollbackPrompt
      responses: { '200': { description: New enabled rollback PromptVersion } }
  /api/v1/prompts/{promptId}/effects/{version}:
    get:
      operationId: getPromptEffect
      responses: { '200': { description: Invocation success/failure/duration/Token summary } }
  /api/v1/models/providers:
    get:
      operationId: listModelProviders
      description: Lists credential-free Provider configurations from PostgreSQL.
      responses: { '200': { description: Credential-free Provider inventory } }
  /api/v1/models/providers/{providerId}:
    parameters: [{ name: providerId, in: path, required: true, schema: { type: string } }]
    put:
      operationId: configureModelProvider
      description: Stores an AES-GCM encrypted credential and protocol-neutral Provider configuration. Provider kind is independent from the explicit HTTP API style.
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      additionalProperties: false,
                      required:
                        [
                          name,
                          kind,
                          apiStyle,
                          baseUrl,
                          model,
                          enabled,
                          timeoutMs,
                          credentialHeaders,
                        ],
                      properties:
                        {
                          name: { type: string },
                          kind: { enum: [openai_compatible, local, other_vendor] },
                          apiStyle: { enum: [openai_chat_completions, anthropic_messages] },
                          baseUrl: { type: string, format: uri },
                          model: { type: string },
                          enabled: { type: boolean },
                          timeoutMs: { type: integer, minimum: 1 },
                          credentialHeaders:
                            { type: object, additionalProperties: { type: string } },
                        },
                    },
                },
            },
        }
      responses:
        { '204': { description: Configured }, '400': { $ref: '#/components/responses/Error' } }
  /api/v1/models/routes:
    get:
      operationId: listModelStageRoutes
      responses: { '200': { description: Fixed model-stage route inventory } }
  /api/v1/models/routes/{stage}:
    parameters: [{ name: stage, in: path, required: true, schema: { type: string } }]
    put:
      operationId: routeModelStage
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [providerId],
                      properties: { providerId: { type: string } },
                    },
                },
            },
        }
      responses:
        {
          '204': { description: Fixed route configured },
          '400': { $ref: '#/components/responses/Error' },
        }
  /api/v1/models/invocations:
    get:
      operationId: listModelInvocations
      parameters:
        - { name: stage, in: query, required: false, schema: { type: string } }
        - { name: taskId, in: query, required: false, schema: { type: string, minLength: 1 } }
      responses: { '200': { description: Sanitized model invocation audits } }
  /api/v1/health:
    get:
      operationId: getHealth
      responses:
        '200':
          {
            description: Health,
            deployment risk marker,
            and indefinite/no-automatic-cleanup V1 retention posture,
          }
  /api/v1/mcp/invocations:
    get:
      operationId: listTaskMcpInvocations
      parameters:
        - { name: taskId, in: query, required: true, schema: { type: string, minLength: 1 } }
      responses:
        '200': { description: Sanitized MCP invocation audits linked to the Task }
  /api/v1/mcp/servers:
    get:
      operationId: listMcpServers
      responses:
        '200': { description: Credential-free MCP Server list }
    post:
      operationId: registerMcpServer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterMcpServer' }
      responses:
        '201': { description: Registered Server and discovered Tools }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/mcp/servers/{serverId}/notifications/reconnect:
    parameters: [{ $ref: '#/components/parameters/ServerId' }]
    post:
      operationId: reconnectFrozenMcpTaskNotifications
      description: Restarts the composed Frozen Task Notification stream; accepted Task IDs are reconciled after the mandatory subscription Ack.
      responses:
        '202': { description: Reconnect accepted by the local Frozen subscription component }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/mcp/servers/{serverId}:
    parameters: [{ $ref: '#/components/parameters/ServerId' }]
    delete:
      operationId: deleteMcpServer
      responses:
        '204': { description: Deleted }
  /api/v1/mcp/servers/{serverId}/refresh:
    parameters: [{ $ref: '#/components/parameters/ServerId' }]
    post:
      operationId: refreshMcpServer
      responses:
        '200': { description: Refreshed Tools and dependency changes }
  /api/v1/mcp/servers/{serverId}/protocol:
    parameters: [{ $ref: '#/components/parameters/ServerId' }]
    get:
      operationId: diagnoseMcpServerProtocol
      description: Returns the current PostgreSQL discovery snapshot, supported versions, frozen baseline hash, Task Notification capability, per-Tool task behavior and output-schema hashes without credentials.
      responses:
        '200': { description: Current Provider protocol execution evidence and fallback warnings }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/mcp/servers/{serverId}/protocol-baseline-audit:
    parameters: [{ $ref: '#/components/parameters/ServerId' }]
    post:
      operationId: auditMcpServerProtocolBaseline
      description: Compares the persisted Provider discovery baseline SHA-256 to the frozen SDAR baseline without refreshing or mutating Provider state.
      responses:
        '200': { description: Expected/actual baseline hashes and audit disposition }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/mcp/servers/{serverId}/tools:
    parameters: [{ $ref: '#/components/parameters/ServerId' }]
    get:
      operationId: listMcpTools
      responses:
        '200': { description: Current original schemas and enhancements }
  /api/v1/mcp/servers/{serverId}/tools/{toolName}/enhancement:
    parameters:
      - $ref: '#/components/parameters/ServerId'
      - { name: toolName, in: path, required: true, schema: { type: string } }
    put:
      operationId: updateMcpToolEnhancement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ToolEnhancement' }
      responses:
        '204': { description: Updated }
  /api/v1/mcp/servers/{serverId}/tools/{toolName}/execution-semantics:
    parameters:
      - $ref: '#/components/parameters/ServerId'
      - { name: toolName, in: path, required: true, schema: { type: string } }
    put:
      operationId: updateMcpToolExecutionSemantics
      description: Retains a credential-free administrator semantics override across discovery refreshes. An available MCP declaration remains authoritative.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/McpToolExecutionSemanticsValues' }
      responses:
        '204': { description: Override retained and effective semantics recalculated }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/mcp/servers/{serverId}/invocations:
    parameters: [{ $ref: '#/components/parameters/ServerId' }]
    get:
      operationId: listMcpInvocations
      responses:
        '200': { description: Replayable invocation summaries }
  /api/v1/mcp/servers/{serverId}/operations:
    parameters: [{ $ref: '#/components/parameters/ServerId' }]
    get:
      operationId: listMcpManagementOperations
      description: Returns credential-safe, append-only administrator operation evidence.
      responses:
        '200':
          {
            description: MCP registration,
            refresh,
            health,
            credential,
            metadata,
            and deletion operations,
          }
  /api/v1/mcp/servers/{serverId}/warnings:
    parameters: [{ $ref: '#/components/parameters/ServerId' }]
    get:
      operationId: listMcpDependencyWarnings
      responses:
        '200': { description: Skill dependency warnings }
  /api/v1/skills:
    get:
      operationId: listCurrentSkillVersions
      responses:
        '200': { description: Current Skill versions }
    post:
      operationId: registerSkillVersion
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '201': { description: New current Skill version }
  /api/v1/capabilities/summary:
    get:
      operationId: getRuntimeCapabilitySummary
      description: Returns only the active Capability Summary whose catalogHash matches the current enabled exact Skill declarations, plus a bounded Level-0 index. It never reports current Provider or device readiness.
      parameters:
        - { name: maxEntries, in: query, schema: { type: integer, minimum: 1, maximum: 256 } }
        - {
            name: maxCharacters,
            in: query,
            schema: { type: integer, minimum: 256, maximum: 65536 },
          }
      responses:
        '200':
          description: Hash-matched internal Capability Summary and bounded progressive index
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilitySummaryView' }
              example:
                summary:
                  schemaVersion: '1.0'
                  summaryId: summary.example
                  revision: 1
                  catalogHash: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                  generationPolicyVersion: capability-policy-v1
                  status: active
                  items: []
                  sourceRefs: []
                  builtAt: '2026-07-23T01:20:00.000Z'
                index:
                  schemaVersion: '1.0'
                  summaryId: summary.example
                  catalogHash: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                  entries: []
                  characterCount: 2
                  truncated: false
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/capabilities/summary/{summaryId}:
    parameters: [{ name: summaryId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getRuntimeCapabilitySummaryById
      description: Returns one immutable internal Capability Summary revision by identity.
      responses:
        '200':
          description: Requested Capability Summary and bounded index
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilitySummaryView' }
