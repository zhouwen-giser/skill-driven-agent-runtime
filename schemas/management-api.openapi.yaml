    post:
      operationId: correctSkillFormalizationCandidate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorrectEvolutionCandidate' }
      responses:
        '200': { description: Corrected candidate and full revalidation result }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/evolution-experiences/{experienceId}:
    parameters: [{ name: experienceId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getEvolutionExperience
      responses:
        '200': { description: Source-linked evolution Experience }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/goals/{goalId}/evolution-experiences:
    parameters: [{ name: goalId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: listGoalEvolutionExperiences
      responses:
        '200': { description: Evolution Experiences linked to a Goal }
  /api/v1/skills/{skillId}/evolution-experiences:
    parameters: [{ $ref: '#/components/parameters/SkillId' }]
    get:
      operationId: listSkillEvolutionExperiences
      responses:
        '200': { description: Evolution Experiences linked to a Skill }
  /api/v1/skill-drafts/{draftId}:
    parameters: [{ name: draftId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getSkillDraft
      responses:
        '200': { description: Generated Skill draft and validation evidence }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/skill-drafts/{draftId}/publish:
    parameters: [{ name: draftId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: publishSkillDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [actor, skillId, toolPolicy, runtimePolicy, status]
              properties:
                actor: { type: string, minLength: 1 }
                skillId: { type: string, minLength: 1 }
                toolPolicy: { type: object, additionalProperties: true }
                runtimePolicy: { type: object, additionalProperties: true }
                status: { enum: [enabled, disabled] }
      responses:
        '201': { description: Published formal Skill version }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/skills/{skillId}/quality-observations:
    parameters: [{ $ref: '#/components/parameters/SkillId' }]
    post:
      operationId: recordSkillQualityObservation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillQualityObservation' }
      responses:
        '201': { description: Persisted quality observation and optional warning }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/skill-quality-warnings:
    get:
      operationId: listSkillQualityWarnings
      parameters:
        - { name: skillId, in: query, schema: { type: string, minLength: 1 } }
      responses:
        '200': { description: Warning-only low-quality Skill signals }
  /api/v1/workflow-templates:
    get:
      operationId: listWorkflowTemplates
      parameters:
        - { name: skillId, in: query, schema: { type: string, minLength: 1 } }
        - { name: capabilityFingerprint, in: query, schema: { type: string, minLength: 1 } }
      responses:
        '200': { description: Versioned successful Workflow templates }
  /api/v1/workflow-templates/{templateId}/uses:
    parameters: [{ name: templateId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: listWorkflowTemplateUses
      responses:
        '200': { description: Immutable template reuse and effect evidence }
  /api/v1/evaluation/analytics:
    get:
      operationId: getEvaluationAnalytics
      description: Aggregates immutable execution, quality, model, and Tool evidence from PostgreSQL.
      parameters:
        - { name: skillId, in: query, schema: { type: string, minLength: 1 } }
        - { name: skillVersion, in: query, schema: { type: integer, minimum: 1 } }
        - { name: providerId, in: query, schema: { type: string, minLength: 1 } }
        - { name: model, in: query, schema: { type: string, minLength: 1 } }
        - { name: serverId, in: query, schema: { type: string, minLength: 1 } }
        - { name: toolName, in: query, schema: { type: string, minLength: 1 } }
      responses:
        '200':
          description: Success, duration, cost, failure, version-stability, and quality-trend metrics.
          content:
            application/json:
              example:
                filters: { skillId: device-status, skillVersion: 2 }
                sampleCount: 3
                successCount: 2
                successRate: 0.666667
                averageDurationMs: 125
                totalCost: 3
                averageCost: 1
                failureTypes: [{ code: MCP_TIMEOUT, count: 1 }]
                versionStability:
                  - {
                      skillId: device-status,
                      skillVersion: 2,
                      sampleCount: 3,
                      successRate: 0.666667,
                      averageQuality: 0.8,
                      qualityDeviation: 0.1,
                      stabilityScore: 0.6,
                    }
                qualityTrend: []
        '400': { $ref: '#/components/responses/Error' }
components:
  parameters:
    CandidateId: { name: candidateId, in: path, required: true, schema: { type: string } }
    MemoryId: { name: memoryId, in: path, required: true, schema: { type: string } }
    ServerId: { name: serverId, in: path, required: true, schema: { type: string } }
    SkillId: { name: skillId, in: path, required: true, schema: { type: string } }
    TaskId: { name: taskId, in: path, required: true, schema: { type: string } }
  responses:
    Error:
      description: Stable error envelope
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
  schemas:
    GoalExecutionContract:
      type: object
      additionalProperties: false
      required: [goalId, version, title, description, constraints, successCriteria]
      properties:
        goalId: { type: string, minLength: 1 }
        version: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        constraints: { type: array, items: { type: string } }
        successCriteria: { type: array, items: { type: string } }
      example:
        goalId: goal-inspect-1
        version: 2
        title: Inspect device safely
        description: Return the current device status.
        constraints: [read-only, no actuator calls]
        successCriteria: [status and observation are returned]
    MemoryRetentionPolicy:
      type: object
      additionalProperties: false
      required:
        [
          reviewAfterDays,
          archiveAfterDays,
          deleteAfterDays,
          automaticArchiveEnabled,
          automaticDeleteEnabled,
        ]
      properties:
        reviewAfterDays: { type: integer, minimum: 1 }
        archiveAfterDays: { type: [integer, 'null'], minimum: 1 }
        deleteAfterDays: { type: [integer, 'null'], minimum: 1 }
        automaticArchiveEnabled: { type: boolean, const: false }
        automaticDeleteEnabled: { type: boolean, const: false }
    MemoryStatusAction:
      type: object
      additionalProperties: false
      required: [actor, reason]
      properties:
        actor: { type: string, minLength: 1 }
        reason: { type: string, minLength: 1 }
    SupersedeMemory:
      allOf:
        - $ref: '#/components/schemas/MemoryStatusAction'
        - type: object
          required: [type, content, summary, sourceRefs, confidence]
          properties:
            type:
              {
                enum:
                  [
                    fact,
                    success_experience,
                    failure_experience,
                    workflow_pattern,
                    skill_learning,
                    prompt_learning,
                  ],
              }
            content: { type: object, additionalProperties: true }
            summary: { type: string, minLength: 1 }
            sourceRefs: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
            confidence: { type: number, minimum: 0, maximum: 1 }
    CorrectEvolutionCandidate:
      type: object
      additionalProperties: false
      required: [actor, summary, proposedSkill]
      properties:
        actor: { type: string, minLength: 1 }
        summary: { type: string, minLength: 1 }
        proposedSkill: { type: object, additionalProperties: true }
    SkillQualityObservation:
      type: object
      additionalProperties: false
      required: [skillVersion, evaluationRef, score, successful]
      properties:
        skillVersion: { type: integer, minimum: 1 }
        evaluationRef: { type: string, minLength: 1 }
        score: { type: number, minimum: 0, maximum: 1 }
        successful: { type: boolean }
    RegisterMcpServer:
      type: object
      additionalProperties: false
      required: [serverId, name, endpoint, credentialHeaders]
      properties:
        serverId: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        endpoint: { type: string, format: uri }
        credentialHeaders: { type: object, additionalProperties: { type: string } }
    ToolEnhancement:
      type: object
      additionalProperties: false
      required: [purpose, scenarios, constraints, returnDescription, commonErrors, tags]
      properties:
        purpose: { type: string }
        scenarios: { type: array, items: { type: string } }
        constraints: { type: array, items: { type: string } }
        returnDescription: { type: string }
        commonErrors: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
    McpToolExecutionSemanticsValues:
      type: object
      additionalProperties: false
      required: [effect, execution, cancellation, idempotency, replay]
      properties:
        effect: { type: string, enum: [read_only, side_effecting, unknown] }
        execution: { type: string, enum: [synchronous, task_capable, task_required, unknown] }
