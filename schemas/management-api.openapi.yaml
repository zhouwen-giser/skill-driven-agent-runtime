                successRate: 0.666667
                averageDurationMs: 125
                totalCost: 3
                averageCost: 1
                failureTypes: [{ code: MCP_TIMEOUT, count: 1 }]
                versionStability:
                  - {
                      skillId: device-status,
                      skillVersion: 2,
                      sampleCount: 3,
                      successRate: 0.666667,
                      averageQuality: 0.8,
                      qualityDeviation: 0.1,
                      stabilityScore: 0.6,
                    }
                qualityTrend: []
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/artifacts:
    get:
      operationId: listManagedArtifacts
      security: [{ CognitiveBearer: [] }]
      description: Tenant- and role-scoped Artifact registry projection with cursor pagination.
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: status, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string } }
        - { name: taskType, in: query, schema: { type: string } }
        - { name: risk, in: query, schema: { type: string } }
        - { name: createdFrom, in: query, schema: { type: string, format: date-time } }
        - { name: createdTo, in: query, schema: { type: string, format: date-time } }
        - { name: driftSeverity, in: query, schema: { type: string } }
        - { name: active, in: query, schema: { type: boolean } }
        - {
            name: sort,
            in: query,
            schema: { type: string, enum: [created_desc, created_asc, key_asc] },
          }
      responses:
        '200':
          description: Redacted Artifact registry projection
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { type: object, additionalProperties: true } }
                  nextCursor: { type: string }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/artifacts/{artifactId}:
    parameters: [{ name: artifactId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getManagedArtifact
      security: [{ CognitiveBearer: [] }]
      responses:
        '200':
          description: Versioned and redacted Artifact detail
          headers: { ETag: { schema: { type: string } } }
        '404': { $ref: '#/components/responses/Error' }
