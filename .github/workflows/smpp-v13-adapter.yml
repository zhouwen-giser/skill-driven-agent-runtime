name: SMPP UGV v1.3 Adapter
on:
  push:
    branches:
      - codex/sdar-smpp-ugv-v1.3-taskbusiness
  pull_request:
    paths:
      - packages/mcp-adapter/**
      - packages/application/**
      - apps/server/src/runtime.ts
      - .github/workflows/smpp-v13-adapter.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - name: Show exact formatter changes on failure
        if: failure()
        run: |
          pnpm exec prettier --write packages/mcp-adapter/src/frozen-v1-mcp-client.ts packages/mcp-adapter/src/smpp-task-business-client.ts packages/mcp-adapter/test/smpp-task-business-client.contract.test.ts packages/application/src/mcp-registry.ts packages/application/test/mcp-registry.unit.test.ts apps/server/src/runtime.ts
          git diff -- packages/mcp-adapter packages/application/src/mcp-registry.ts packages/application/test/mcp-registry.unit.test.ts apps/server/src/runtime.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec vitest run packages/mcp-adapter/test/smpp-task-business-client.contract.test.ts packages/mcp-adapter/test/frozen-v1-http.contract.test.ts packages/application/test/mcp-registry.unit.test.ts
