asyncapi: 2.6.0
info:
  title: SDAR v1.4 Node Events
  version: 1.0.0
  description: SSE hint events for organization-facing consumers.
servers:
  nodeControl:
    url: https://127.0.0.1:10080
    protocol: https
channels:
  /api/v1/events:
    subscribe:
      operationId: subscribeNodeEvents
      message:
        oneOf:
        - $ref: '#/components/messages/node_profile_changed'
        - $ref: '#/components/messages/node_health_changed'
        - $ref: '#/components/messages/node_configuration_revision_published'
        - $ref: '#/components/messages/node_configuration_revision_applied'
        - $ref: '#/components/messages/node_configuration_revision_rejected'
        - $ref: '#/components/messages/node_llm_provider_changed'
        - $ref: '#/components/messages/node_smpp_source_changed'
        - $ref: '#/components/messages/node_mcp_provider_binding_changed'
        - $ref: '#/components/messages/node_skill_version_changed'
        - $ref: '#/components/messages/node_plan_template_version_changed'
        - $ref: '#/components/messages/node_capability_version_published'
        - $ref: '#/components/messages/node_capability_version_suspended'
        - $ref: '#/components/messages/node_capability_version_deprecated'
        - $ref: '#/components/messages/node_capability_version_retired'
        - $ref: '#/components/messages/node_capability_readiness_changed'
        - $ref: '#/components/messages/node_a2a_exposure_changed'
        - $ref: '#/components/messages/node_agent_card_activated'
        - $ref: '#/components/messages/node_task_capability_bound'
        - $ref: '#/components/messages/node_management_operation_completed'
        - $ref: '#/components/messages/node_telemetry_export_status_changed'
components:
  messages:
    node_profile_changed:
      name: node.profile.changed
      title: node.profile.changed
      payload:
        $ref: ../schemas/event-envelope.schema.json
      x-event-type: node.profile.changed
    node_health_changed:
      name: node.health.changed
      title: node.health.changed
      payload:
        $ref: ../schemas/event-envelope.schema.json
      x-event-type: node.health.changed
    node_configuration_revision_published:
